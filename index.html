<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hunch">
  <title>Hunch</title>
  <link rel="icon" type="image/png" href="file_000000008ea082309867563369780742.png">

  <style>
    :root{color-scheme:dark;--bg:#0b0b0b;--panel:#171717;--panel2:#202020;--border:#363636;--text:#fff;--muted:#8f8f8f;--green:#20c65a;--red:#c62828}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}
    button,textarea{font:inherit}
    #app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 25%,#1a1a1a 0%,#0b0b0b 55%,#050505 100%)}
    header{min-height:66px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;gap:10px;flex:0 0 auto;font-size:20px;font-weight:800;letter-spacing:.18em}
    header img{width:28px;height:28px;border-radius:7px;object-fit:cover}
    #viewport{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:pan-y}
    #track{height:100%;display:flex;transition:transform 280ms cubic-bezier(.2,.8,.2,1);will-change:transform}
    .card,.empty{min-width:100vw;height:100%;padding:24px 28px 150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none}
    .note{width:min(820px,100%);font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,7vw,54px);line-height:1.18;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
    .tools{margin-top:34px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .tools button{min-width:82px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);padding:11px 16px;font-size:14px;font-weight:700}
    .tools .delete{background:var(--red);border-color:var(--red)}
    .tools .done{background:var(--green);border-color:var(--green)}
    .empty{color:var(--muted);font-size:18px}
    #counter{position:fixed;left:0;right:0;bottom:calc(25px + env(safe-area-inset-bottom));text-align:center;font-size:13px;opacity:.45;pointer-events:none}
    .hint{position:fixed;left:24px;bottom:calc(65px + env(safe-area-inset-bottom));font-size:12px;opacity:.30;pointer-events:none}
    #addBtn{position:fixed;right:24px;bottom:calc(54px + env(safe-area-inset-bottom));z-index:20;width:68px;height:68px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:44px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.45)}
    #modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
    #modal.open{display:flex}
    .sheet{width:min(680px,100%);background:var(--panel);border:1px solid #303030;border-radius:22px;padding:18px;box-shadow:0 15px 60px rgba(0,0,0,.6)}
    .sheet h2{margin:2px 0 14px;font-size:22px}
    textarea{width:100%;min-height:150px;border:1px solid #3a3a3a;border-radius:13px;background:#0d0d0d;color:#fff;padding:14px;font-size:18px;outline:none;resize:vertical}
    .actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;min-height:50px;border-radius:13px;border:0;font-size:17px;font-weight:700}
    #cancelBtn{background:#303030;color:#fff}#saveBtn{background:var(--green);color:#fff}
    @media(max-width:420px){.tools button{min-width:76px;padding:10px 13px}}
  </style>
</head>

<div id="app">
  <header><img src="file_000000008ea082309867563369780742.png" alt=""><span>HUNCH</span></header>
  <main id="viewport"><div id="track"></div></main>

</div>

  function goTo(i,animate=true){if(!notes.length)return;currentIndex=Math.max(0,Math.min(i,notes.length-1));track.style.transition=animate?"transform 280ms cubic-bezier(.2,.8,.2,1)":"none";track.style.transform=`translateX(${-currentIndex*window.innerWidth}px)`;counter.textContent=`${currentIndex+1} / ${notes.length}`}

  function deleteNote(i){if(!window.confirm("Delete this note?"))return;notes.splice(i,1);saveNotes();currentIndex=Math.min(i,Math.max(0,notes.length-1));render()}
  function completeNote(i){notes.splice(i,1);saveNotes();currentIndex=Math.min(i,Math.max(0,notes.length-1));render()}
  addBtn.addEventListener("click",()=>openEditor());cancelBtn.addEventListener("click",closeEditor);saveBtn.addEventListener("click",saveCurrentNote);modal.addEventListener("click",e=>{if(e.target===modal)closeEditor()});input.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")saveCurrentNote()});
  track.addEventListener("click",e=>{const edit=e.target.closest(".edit"), del=e.target.closest(".delete"), done=e.target.closest(".done");if(edit){openEditor(Number(edit.dataset.index));return}if(del){deleteNote(Number(del.dataset.index));return}if(done)completeNote(Number(done.dataset.index))});

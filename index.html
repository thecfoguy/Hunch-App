<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hunch">

  <title>Hunch</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4f4f1;
      color: #181818;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding-bottom: 110px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 16px 14px;
      background: #f4f4f1;
      border-bottom: 1px solid #ddddda;
    }

    .header-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
    }

    .title {
      font-size: 29px;
      font-weight: 800;
    }

    #notes {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    .empty {
      padding: 80px 20px;
      text-align: center;
      color: #777777;
      font-size: 18px;
      line-height: 1.5;
    }

    .note {
      max-height: 500px;
      margin-bottom: 14px;
      padding: 18px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e0e0dc;
      border-radius: 18px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      opacity: 1;
      transform: translateX(0);

      transition:
        opacity 0.42s ease,
        transform 0.42s ease,
        max-height 0.42s ease,
        padding 0.42s ease,
        margin 0.42s ease;
    }

    .note.disappear {
      opacity: 0;
      transform: translateX(120%);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      border-width: 0;
    }

    .note-text {
      margin-bottom: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 19px;
      line-height: 1.5;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .action-button {
      min-height: 44px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .edit-button {
      background: #e7e7e3;
      color: #222222;
    }

    .delete-button {
      background: #f1dede;
      color: #a22323;
    }

    .done-button {
      background: #ddefe3;
      color: #16763a;
    }

    .edit-box {
      width: 100%;
      min-height: 110px;
      margin-bottom: 16px;
      padding: 12px;
      resize: vertical;
      outline: none;
      background: #ffffff;
      color: #181818;
      border: 2px solid #1f9d55;
      border-radius: 12px;
      font-family: inherit;
      font-size: 19px;
      line-height: 1.5;
    }

    #addButton {
      position: fixed;
      right: 22px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 20;

      width: 64px;
      height: 64px;

      border: none;
      border-radius: 50%;

      background: #1fa857;
      color: #ffffff;

      font-size: 43px;
      font-weight: 300;
      line-height: 60px;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      cursor: pointer;
    }

    #composer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      background: rgba(0, 0, 0, 0.45);
    }

    #composer.open {
      display: flex;
    }

    .composer-panel {
      width: 100%;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      background: #f4f4f1;
      border-radius: 22px 22px 0 0;
    }

    .composer-inner {
      max-width: 700px;
      margin: 0 auto;
    }

    .composer-title {
      margin-bottom: 12px;
      font-size: 22px;
      font-weight: 800;
    }

    #newNote {
      width: 100%;
      min-height: 160px;
      padding: 14px;
      resize: vertical;
      outline: none;
      background: #ffffff;
      color: #181818;
      border: 2px solid #ccccca;
      border-radius: 14px;
      font-family: inherit;
      font-size: 19px;
      line-height: 1.5;
    }

    #newNote:focus {
      border-color: #1f9d55;
    }

    .composer-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .composer-buttons button {
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
    }

    #cancelButton {
      background: #ddddda;
      color: #222222;
    }

    #saveButton {
      background: #1fa857;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo">H</div>
      <div class="title">Hunch</div>
    </div>
  </header>

  <main id="notes"></main>

  <button
    id="addButton"
    type="button"
    aria-label="Add note"
  >+</button>

  <div id="composer">
    <div class="composer-panel">
      <div class="composer-inner">

        <div class="composer-title">New note</div>

        <textarea
          id="newNote"
          placeholder="What's on your mind?"
        ></textarea>

        <div class="composer-buttons">
          <button id="cancelButton" type="button">
            Cancel
          </button>

          <button id="saveButton" type="button">
            Save
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "hunch-notes-v2";

    const notesContainer =
      document.getElementById("notes");

    const addButton =
      document.getElementById("addButton");

    const composer =
      document.getElementById("composer");

    const newNote =
      document.getElementById("newNote");

    const saveButton =
      document.getElementById("saveButton");

    const cancelButton =
      document.getElementById("cancelButton");

    let notes = loadNotes();

    function loadNotes() {
      try {
        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return [];
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed;
      } catch (error) {
        console.error(
          "Could not load notes:",
          error
        );

        return [];
      }
    }

    function saveNotes() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(notes)
        );
      } catch (error) {
        console.error(
          "Could not save notes:",
          error
        );
      }
    }

    function makeId() {
      return (
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).slice(2, 10)
      );
    }

    function activeNotes() {
      return notes.filter(function(note) {
        return note.done !== true;
      });
    }

    function renderNotes() {
      notesContainer.innerHTML = "";

      const visibleNotes = activeNotes();

      if (visibleNotes.length === 0) {
        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.textContent =
          "No notes yet. Tap the green + button to add one.";

        notesContainer.appendChild(empty);

        return;
      }

      visibleNotes.forEach(function(note) {
        const card =
          document.createElement("article");

        card.className = "note";

        card.dataset.id = note.id;

        const text =
          document.createElement("div");

        text.className = "note-text";

        text.textContent = note.text;

        const buttons =
          document.createElement("div");

        buttons.className = "button-row";

        const editButton =
          document.createElement("button");

        editButton.type = "button";

        editButton.className =
          "action-button edit-button";

        editButton.textContent = "Edit";

        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";

        deleteButton.className =
          "action-button delete-button";

        deleteButton.textContent = "Delete";

        const doneButton =
          document.createElement("button");

        doneButton.type = "button";

        doneButton.className =
          "action-button done-button";

        doneButton.textContent = "Done";

        editButton.addEventListener(
          "click",
          function() {
            startEditing(card, note);
          }
        );

        deleteButton.addEventListener(
          "click",
          function() {
            const confirmed =
              window.confirm(
                "Delete this note?"
              );

            if (!confirmed) {
              return;
            }

            notes = notes.filter(
              function(item) {
                return item.id !== note.id;
              }
            );

            saveNotes();
            renderNotes();
          }
        );

        doneButton.addEventListener(
          "click",
          function() {
            card.classList.add("disappear");

            note.done = true;

            saveNotes();

            window.setTimeout(
              function() {
                renderNotes();
              },
              430
            );
          }
        );

        buttons.appendChild(editButton);
        buttons.appendChild(deleteButton);
        buttons.appendChild(doneButton);

        card.appendChild(text);
        card.appendChild(buttons);

        notesContainer.appendChild(card);
      });
    }

    function startEditing(card, note) {
      card.innerHTML = "";

      const editBox =
        document.createElement("textarea");

      editBox.className = "edit-box";

      editBox.value = note.text;

      const buttons =
        document.createElement("div");

      buttons.className = "button-row";

      buttons.style.gridTemplateColumns =
        "1fr 1fr";

      const cancelEditButton =
        document.createElement("button");

      cancelEditButton.type = "button";

      cancelEditButton.className =
        "action-button edit-button";

      cancelEditButton.textContent =
        "Cancel";

      const saveEditButton =
        document.createElement("button");

      saveEditButton.type = "button";

      saveEditButton.className =
        "action-button done-button";

      saveEditButton.textContent =
        "Save";

      cancelEditButton.addEventListener(
        "click",
        function() {
          renderNotes();
        }
      );

      saveEditButton.addEventListener(
        "click",
        function() {
          const updatedText =
            editBox.value.trim();

          if (!updatedText) {
            return;
          }

          note.text = updatedText;

          saveNotes();

          renderNotes();
        }
      );

      buttons.appendChild(
        cancelEditButton
      );

      buttons.appendChild(
        saveEditButton
      );

      card.appendChild(editBox);
      card.appendChild(buttons);

      editBox.focus();

      editBox.setSelectionRange(
        editBox.value.length,
        editBox.value.length
      );
    }

    function openComposer() {
      newNote.value = "";

      composer.classList.add("open");

      window.setTimeout(
        function() {
          newNote.focus();
        },
        100
      );
    }

    function closeComposer() {
      composer.classList.remove("open");

      newNote.blur();
    }

    function addNewNote() {
      const text =
        newNote.value.trim();

      if (!text) {
        return;
      }

      const note = {
        id: makeId(),
        text: text,
        done: false,
        createdAt: Date.now()
      };

      notes.unshift(note);

      saveNotes();

      closeComposer();

      renderNotes();
    }

    addButton.addEventListener(
      "click",
      openComposer
    );

    cancelButton.addEventListener(
      "click",
      closeComposer
    );

    saveButton.addEventListener(
      "click",
      addNewNote
    );

    composer.addEventListener(
      "click",
      function(event) {
        if (event.target === composer) {
          closeComposer();
        }
      }
    );

    renderNotes();

    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        function() {
          navigator.serviceWorker
            .register("./sw.js")
            .catch(function(error) {
              console.error(
                "Service worker failed:",
                error
              );
            });
        }
      );
    }
  </script>

</body>
</html>
